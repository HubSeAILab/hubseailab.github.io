name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Copiar esquemas e ajustar estrutura da página inicial
        run: |
          mkdir -p front/schemas
          cp schemas/publication-final.schema.json front/schemas/publication-final.schema.json
          cp -r front/index/* front/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dos artefatos
        uses: actions/upload-pages-artifact@v3
        with:
          path: './front'

      - name: Deploy para o GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
