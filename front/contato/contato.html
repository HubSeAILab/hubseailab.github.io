<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>HUB-SE | Contato</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../assets/logos/logoempe.png" type="image/png">
  <link rel="stylesheet" href="contato.css">
  <link rel="stylesheet" href="../components/layout.css">
</head>
<body>

  <!-- Navbar Global Unificada -->
  <div id="site-navbar" data-pagina="contato"></div>

  <main class="contato-main">
    <div class="contato-card">
      <h1 class="contato-titulo">
        Entre em contato!
      </h1>

      <form id="form-contato">
        <div class="campo">
          <label for="nome">Nome</label>
          <input id="nome" name="nome" type="text" maxlength="100" required placeholder="Seu nome completo">
        </div>

        <div class="campo">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" maxlength="255" required placeholder="seuemail@exemplo.com">
        </div>

        <div class="campo">
          <label for="mensagem">Mensagem</label>
          <textarea id="mensagem" name="mensagem" rows="5" maxlength="1500" required placeholder="Como podemos te ajudar?"></textarea>
        </div>

        <!-- HONEYPOT: Campo invisível para pegar robôs -->
        <input type="text" id="telefone_secundario" name="telefone_secundario" style="display:none !important" tabindex="-1" autocomplete="off">

        <button type="submit" class="btn-enviar">
          Enviar
        </button>

        <!-- Feedback normal (sucesso ou carregando) -->
        <p id="feedback" class="feedback" hidden></p>

        <!-- Container do Plano B -->
        <div id="fallback-container" hidden style="margin-top: 20px; text-align: center; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 15px;">
          <p style="font-size: 14px; color: #ffcccc; margin-bottom: 12px; line-height: 1.4;">
            Ops! Tivemos um problema de conexão. Por favor, clique no botão abaixo para enviar sua mensagem usando seu aplicativo de e-mail:
          </p>
          <button type="button" id="btn-fallback" class="btn-enviar" style="width: 100%; max-width: 260px; font-size: 14px;">
            Abrir App de E-mail
          </button>
        </div>
      </form>
    </div>
  </main>

  <!-- Footer Global Unificado -->
  <div id="site-footer"></div>

  <script src="../components/layout.js"></script>

  <script>
    const form = document.getElementById('form-contato');
    const feedback = document.getElementById('feedback');
    const fallbackContainer = document.getElementById('fallback-container');
    const btnFallback = document.getElementById('btn-fallback');

    /* ==========================================================================
       A URL DA SUA API NO GOOGLE APPS SCRIPT
    ========================================================================== */
    const URL_GOOGLE_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbxsi4tYS2v-UaNuaDa0xlZF4GaoJVZ9GbCMbPnEuHettCiSE3GXdU0yL7ggFbcsHeEisQ/exec";

    /* ==========================================================================
       E-MAIL DE TESTE (Para o botão de emergência)
    ========================================================================== */
    const EMAIL_DESTINO_FALLBACK = "eduardoborgesdesouza4@gmail.com";

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      feedback.hidden = false;
      fallbackContainer.hidden = true; 
      feedback.textContent = 'Enviando mensagem...';

      const nome = form.nome.value.trim();
      const email = form.email.value.trim();
      const msg = form.mensagem.value.trim();
      
      // Pega o valor do honeypot
      const honeypot = document.getElementById('telefone_secundario').value.trim();

      // Monta os parâmetros de envio via URL (incluindo o honeypot para o backend barrar)
      const urlEnvio = `${URL_GOOGLE_APPS_SCRIPT}?nome=${encodeURIComponent(nome)}&email=${encodeURIComponent(email)}&mensagem=${encodeURIComponent(msg)}&telefone_secundario=${encodeURIComponent(honeypot)}`;

      try {
        await fetch(urlEnvio, {
          method: 'GET',
          mode: 'no-cors'
        });

        feedback.textContent = 'Mensagem enviada com sucesso! Em breve entraremos em contato.';
        form.reset(); 
      } catch (error) {
        mostrarPlanoB();
      }
    });

    function mostrarPlanoB() {
      feedback.hidden = true; 
      fallbackContainer.hidden = false; 
    }

    btnFallback.addEventListener('click', () => {
      const nome = form.nome.value.trim();
      const email = form.email.value.trim();
      const msg = form.mensagem.value.trim();

      const assunto = `[Contato HUB-SE] Mensagem de ${nome}`;
      const corpo = `Nome: ${nome}\nEmail: ${email}\n\nMensagem:\n${msg}`;

      window.location.href = `mailto:${EMAIL_DESTINO_FALLBACK}?subject=${encodeURIComponent(assunto)}&body=${encodeURIComponent(corpo)}`;

      fallbackContainer.hidden = true;
      feedback.hidden = false;
      feedback.textContent = 'Abrindo seu aplicativo de e-mail...';
    });
  </script>
</body>
</html>
